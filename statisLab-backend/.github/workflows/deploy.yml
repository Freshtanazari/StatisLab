name: Sync to Hugging Face

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Push to Hugging Face
        uses: huggingface/huggingface_hub@main
        with:
          repo_id: Freshta/StatisLab
          token: ${{ secrets.STATISLAB }}
          folder_path: ./statisLab-backend
          repo_type: space