name: Sync to Hugging Face

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.STATISLAB }}
        run: |
          git remote add hf https://Freshta:${HF_TOKEN}@huggingface.co/spaces/Freshta/StatisLab
          git push hf `git subtree split --prefix statisLab-backend main`:main --force